# ============================================================
#  HTTP
# ============================================================
# 7575 plain / 7443 TLS. Port 3000 belongs to the frontend, not this API.
quarkus.http.port=7575
quarkus.http.ssl-port=7443

# ---- TLS ----
# Dev uses a committed self-signed localhost certificate so 7443 binds on a fresh
# clone with no setup. It is worthless outside development -- self-signed, CN=localhost,
# password in plain sight below. NEVER point production at this keystore.
%dev.quarkus.tls.key-store.p12.path=tls/dev-keystore.p12
%dev.quarkus.tls.key-store.p12.password=devonly
%test.quarkus.tls.key-store.p12.path=tls/dev-keystore.p12
%test.quarkus.tls.key-store.p12.password=devonly

# Production supplies its own keystore; the image ships no key material.
%prod.quarkus.tls.key-store.p12.path=${TLS_KEYSTORE_PATH}
%prod.quarkus.tls.key-store.p12.password=${TLS_KEYSTORE_PASSWORD}

# ---- Request body size ----
# The documented upload cap is 50 MiB and UploadResource enforces it, returning the spec's
# error body. This is the container-level backstop and sits deliberately above it: a
# multipart request carrying a legal 50 MiB file is itself larger than 50 MiB once the
# boundaries and part headers are counted, so a limit set exactly at the cap would reject
# files the spec allows.
#
# The cost, stated because it is not obvious: this limit is global. Raising it for uploads
# also means a JSON body of this size is buffered before any route sees it. Bean validation
# caps the fields, but it runs after the buffering. Narrowing it per-route needs a filter
# that does not exist yet.
quarkus.http.limits.max-body-size=52M

# ============================================================
#  File upload (decision D4 -- local disk, synthesised cloud metadata)
# ============================================================
# Where the bytes go. Relative to the working directory in dev; production mounts a volume
# and points this at it, or uploads die with the container.
app.upload.directory=${UPLOAD_DIRECTORY:uploads}

# Tests write under target/, which is already disposable and already ignored, so a test
# run never leaves files in the project root.
%test.app.upload.directory=target/uploads

# The documented cap: 50 MiB, the same unit the spec's own example uses (10485760 = 10 MiB).
app.upload.max-bytes=52428800

# The two strings that make cloudMetadata look like a report from an object store. Nothing
# reads them back; they are what the response says. The provider name is the spec's literal
# value, and the CDN base is example.com -- a reserved placeholder domain that serves
# nothing, which is exactly as true as the metadata is.
app.upload.provider=Google Cloud Object Storage
app.upload.cdn-base-url=${UPLOAD_CDN_BASE_URL:https://cdn.example.com}

# ============================================================
#  Central logging (decision D7 -- files, where the spec says)
# ============================================================
# POST /api/logs appends to <directory>/app.log, and to error.log as well when the level
# is `error`. The spec names /logs; that is an absolute path nothing can write to on a
# developer's machine, so the default is relative and production points this at the
# mounted volume (11.5). Without a volume these files die with the container.
app.logs.directory=${LOG_DIRECTORY:logs}
%prod.app.logs.directory=${LOG_DIRECTORY:/logs}
%test.app.logs.directory=target/logs

# The integration tests launch the packaged application under the `prod` profile, where
# the default above is /logs -- a path nothing can create on a developer's machine, so the
# process would die at startup. These two put the launched process under target/ instead.
# They are read by the test framework, not by the application.
quarkus.test.env.LOG_DIRECTORY=target/it-logs
quarkus.test.env.UPLOAD_DIRECTORY=target/it-uploads

# Rotation, and the only thing bounding growth: at this size the file becomes app.log.1,
# replacing the previous one, and a fresh file starts. One generation is kept, so each
# file costs at most twice this on disk. There is no logging stack in compose to collect
# or trim anything, so nothing else would ever stop it growing.
app.logs.max-bytes=10485760

# ============================================================
#  Datasource -- reactive Postgres (Vert.x PG client)
# ============================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:clickup}
quarkus.datasource.password=${DB_PASSWORD:clickup}
quarkus.datasource.reactive.url=${DB_REACTIVE_URL:postgresql://localhost:5432/clickup}

# Dev talks to the Postgres in docker-compose.yml, not a throwaway container.
# Dev Services would start its own cluster with C collation, so Persian text
# would sort correctly in prod and incorrectly in dev -- see docker-compose.yml.
# Consequence: `./mvnw quarkus:dev` requires `docker compose up -d` first.
quarkus.datasource.devservices.enabled=false

# ---- JDBC (migrations only) ----
# Liquibase ships no reactive driver, so the same database is also reachable over JDBC.
# Nothing else in the application uses this pool -- hence the small ceiling.
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/clickup}
quarkus.datasource.jdbc.max-size=4

# ============================================================
#  Hibernate Reactive
# ============================================================
# Schema is owned by Liquibase, never by Hibernate.
quarkus.hibernate-orm.database.generation=none

# ============================================================
#  Liquibase
# ============================================================
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changeLog.xml

# The seed changelog is demo data -- 30 Persian rows per table sharing one password
# that is published in plain sight in 002-seed-data.sql.
#
# Liquibase filters nothing when no context is given: leaving `contexts` unset in
# production would run the seed, not skip it. Production must therefore name a context
# of its own, so the `seed` changesets are filtered out. Production starts with no
# accounts, which is now fine: POST /api/auth/register creates the first one.
%dev.quarkus.liquibase.contexts=seed
%test.quarkus.liquibase.contexts=seed
%prod.quarkus.liquibase.contexts=production

# ============================================================
#  Authentication
# ============================================================
mp.jwt.verify.issuer=https://arman.ir/clickup
smallrye.jwt.new-token.issuer=https://arman.ir/clickup

# security-jpa contributes an identity provider that understands username/password,
# which is enough for Quarkus to offer HTTP Basic as an authentication mechanism. Say no
# explicitly. The spec documents exactly one way in -- BearerAuth -- and a second,
# undocumented one that ships credentials on every request would be a way around the
# refresh-token rotation the API is built on.
quarkus.http.auth.basic=false

# How long each half of the pair returned by /api/auth/register, /login and /refresh
# lives. The access token is short because it cannot be revoked -- nothing is consulted
# when it is verified. The refresh token is long because it can: it is a row in
# refresh_tokens, and revoking it is an UPDATE.
app.auth.access-token.lifespan=PT15M
app.auth.refresh-token.lifespan=P30D

# ---- Signing keys ----
# Committed dev/test keypair, exactly like the TLS keystore above: a fresh clone can
# issue and verify tokens with no setup. The private key is in the repository, so any
# token it signs is forgeable by anyone who can read this project.
# NEVER point production at these.
%dev.smallrye.jwt.sign.key.location=jwt/dev-privateKey.pem
%dev.mp.jwt.verify.publickey.location=jwt/dev-publicKey.pem
%test.smallrye.jwt.sign.key.location=jwt/dev-privateKey.pem
%test.mp.jwt.verify.publickey.location=jwt/dev-publicKey.pem

# Production points at its own keypair, supplied through the environment.
#
# Be clear about what this does and does not buy: the dev keys are under
# src/main/resources, so they are packaged into the jar and the native image just like
# tls/dev-keystore.p12 already is. Production does not *use* them, but they are present.
# Excluding both from the production build is task 11.4's job.
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION}

# ============================================================
#  Production overrides
# ============================================================
# The native image ships no credentials; supply them via the environment.
%prod.quarkus.http.host=0.0.0.0
