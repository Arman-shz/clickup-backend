openapi: 3.1.0
info:
  title: ClickUp Project Management API
  version: 1.0.0
  description: >
    مستندات کامل و تولیدی (Production-Ready) رابط‌های برنامه‌نویسی کاربردی (API)
    سامانه مدیریت پروژه ClickUp شامل مدیریت هویت، پروژه‌ها و تسک‌ها، چت زنده (SSE)،
    گزارش‌های هفتگی، آپلود فایل ابری و ثبت لاگ متمرکز.
servers:
  - url: http://localhost:7575
    description: سرور توسعه محلی (Local Dev Server)
  - url: https://localhost:7443
    description: سرور توسعه محلی روی TLS (Local Dev Server over TLS)
  - url: https://api.clickup.example.com
    description: سرور اصلی عملیاتی (Production Server)

tags:
  - name: Authentication
    description: مدیریت نشست‌ها، ورود و توکن‌های دسترسی (JWT)
  - name: User Profile
    description: دریافت و ویرایش اطلاعات حساب کاربری و تنظیمات شخص
  - name: Projects
    description: مدیریت چرخه حیات پروژه‌ها (CRUD و Sync)
  - name: Tasks
    description: مدیریت وظایف، وضعیت‌ها و تخصیص‌ها
  - name: Weekly Reports
    description: ثبت و دریافت گزارش‌های کارکرد هفتگی اعضا
  - name: Live Chat
    description: پیام‌رسانی تیمی و استریم زنده پیام‌ها (SSE)
  - name: File Upload
    description: آپلود فایل تا سقف ۵۰ مگابایت و دریافت متادیتای ابری
  - name: Team Members
    description: مشاهده اعضای تیم و نقش‌های آن‌ها
  - name: Central Logging
    description: دریافت لاگ‌ها و خطاهای فرانت‌اند جهت ذخیره متمرکز
  - name: System
    description: بررسی سلامت سرور و دیتابیس

paths:
  # ==================== AUTHENTICATION ====================
  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: ثبت‌نام کاربر جدید
      description: >-
        ساخت حساب کاربری تازه با نام کامل، شماره دانشجویی و رمز عبور.
        حساب ساخته‌شده بلافاصله وارد سیستم می‌شود و همان زوج توکن ورود را دریافت می‌کند،
        بنابراین کلاینت لازم نیست رمز عبور را دوباره ارسال کند.
        هر حساب تازه نقش «student» می‌گیرد؛ نقش مدیر از این مسیر قابل دریافت نیست.
        ایمیل در زمان ثبت‌نام گرفته نمی‌شود و بعدا از طریق PUT /api/users/me تکمیل می‌گردد.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              name: "علی محمدی"
              studentId: "99100111"
              password: "Password123"
      responses:
        '201':
          description: حساب کاربری ساخته شد و کاربر وارد سیستم شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: "eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9..."
                refreshToken: "d8f3a1e2-4b5c-6d7e-8f9a-0b1c2d3e4f5a"
                user:
                  id: "usr_131"
                  studentId: "99100111"
                  name: "علی محمدی"
                  email: null
                  role: "student"
                  avatar: null
                  theme: "light"
                  language: "fa"
                  notificationsEnabled: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: این شماره دانشجویی قبلا ثبت شده است
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "این شماره دانشجویی قبلا ثبت شده است."

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: ورود به حساب کاربری
      description: >-
        ورود دانشجویان و مدیران با شماره دانشجویی/نام کاربری و رمز عبور.
        حساب‌هایی که وضعیت آن‌ها «active» نیست، حتی با رمز درست وارد نمی‌شوند و
        همان خطای ۴۰۱ را می‌گیرند؛ شماره دانشجویی ناشناخته، رمز اشتباه و حساب
        غیرفعال عمدا پاسخ یکسانی دارند تا از بیرون قابل تفکیک نباشند.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              studentId: "99100111"
              password: "Password123"
      responses:
        '200':
          description: ورود موفقیت‌آمیز
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                refreshToken: "d8f3a1e2-4b5c-6d7e-8f9a-0b1c2d3e4f5a"
                user:
                  id: "usr_101"
                  studentId: "99100111"
                  name: "علی محمدی"
                  email: "a.mohammadi@example.com"
                  role: "student"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: نام کاربری یا رمز عبور اشتباه است
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "نام کاربری یا رمز عبور اشتباه است"

  /api/auth/refresh:
    post:
      tags:
        - Authentication
      summary: تمدید توکن دسترسی (Refresh Access Token)
      description: >-
        دریافت توکن دسترسی جدید با ارائه Refresh Token معتبر.
        توکن ارائه‌شده در همان درخواست باطل می‌شود و فقط یک‌بار قابل استفاده است؛
        کلاینت باید توکن رفرش تازه را جایگزین قبلی کند، وگرنه درخواست بعدی ۴۰۱ می‌گیرد.
        توکن ناشناخته، نامعتبر، منقضی، باطل‌شده، یا متعلق به حساب غیرفعال، همگی ۴۰۱ می‌گیرند.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: توکن رفرش معتبر کاربر
            example:
              refreshToken: "d8f3a1e2-4b5c-6d7e-8f9a-0b1c2d3e4f5a"
      responses:
        '200':
          description: تمدید موفقیت‌آمیز توکن
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  refreshToken:
                    type: string
              example:
                accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.new..."
                refreshToken: "f9e8d7c6-5b4a-3f2e-1d0c-9b8a7f6e5d4c"
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== USER PROFILE ====================
  /api/users/me:
    get:
      tags:
        - User Profile
      summary: دریافت اطلاعات پروفایل کاربر جاری
      security:
        - BearerAuth: []
      responses:
        '200':
          description: اطلاعات کامل پروفایل کاربر
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'

    put:
      tags:
        - User Profile
      summary: ویرایش اطلاعات پروفایل و تنظیمات
      description: |
        هر فیلد اختیاری است و فیلدهایی که ارسال نشوند بدون تغییر باقی می‌مانند —
        درخواستی که فقط `theme` را بفرستد نام و ایمیل کاربر را پاک نمی‌کند.
        به همین دلیل، حذف کردن `avatar` یا `email` از این مسیر ممکن نیست؛ تنها
        می‌توان آن‌ها را با مقدار تازه جایگزین کرد.

        `role`، `studentId` و `status` در این درخواست وجود ندارند و از این مسیر
        قابل تغییر نیستند.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
            example:
              name: "علی محمدی (مدیر)"
              avatar: "https://cdn.example.com/avatars/user101.jpg"
              theme: "dark"
              language: "fa"
              notificationsEnabled: true
      responses:
        '200':
          description: پروفایل با موفقیت به‌روزرسانی شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: این ایمیل قبلا توسط حساب دیگری ثبت شده است
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "این ایمیل قبلا ثبت شده است."

  # ==================== PROJECTS ====================
  /api/projects:
    get:
      tags:
        - Projects
      summary: دریافت لیست پروژه‌ها
      description: |
        پروژه‌ها مالک ندارند: در این سند نه فیلد مالکیت هست و نه مفهوم عضویت،
        بنابراین هر کاربر احراز هویت‌شده همان فهرست کامل را می‌بیند.
        ترتیب بر اساس `createdAt`، قدیمی‌ترین اول.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: آرایه پروژه‌ها
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Projects
      summary: ایجاد پروژه جدید
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
            example:
              title: "طراحی سیستم مدیریت هوشمند"
              description: "پروژه فاز اول سامانه ClickUp"
              color: "#3B82F6"
              icon: "FolderKanban"
      responses:
        '201':
          description: پروژه با موفقیت ایجاد شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/projects/{id}:
    put:
      tags:
        - Projects
      summary: ویرایش پروژه موجود
      description: |
        جایگزینی کامل، نه ادغام. بدنه همان `CreateProjectRequest` مسیر ساخت است،
        پس فیلد ارسال‌نشده در هر دو مسیر یک معنا دارد: خالی. درخواستی که فقط
        `title` بفرستد، `description` و `color` و `icon` را پاک می‌کند.
        (مسیر `PUT /api/users/me` رفتار متفاوتی دارد چون شِمای مخصوص خودش را دارد
        که هیچ فیلد الزامی ندارد.)

        `id` و `createdAt` در شِمای درخواست نیستند و تغییر نمی‌کنند.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: "proj_1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '200':
          description: پروژه به‌روزرسانی شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Projects
      summary: حذف پروژه
      description: |
        کارهای متعلق به این پروژه هم حذف می‌شوند (`ON DELETE CASCADE`)، چون
        `tasks.project_id` الزامی است و کار بدون پروژه وجود ندارد.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/projects/sync:
    post:
      tags:
        - Projects
      summary: همگام‌سازی کلی پروژه‌ها (Bulk Sync)
      description: |
        درج یا به‌روزرسانی بر اساس `id`: شناسه‌ای که وجود دارد به‌روزرسانی می‌شود و
        شناسه‌ای که وجود ندارد با همان شناسهٔ ارسالی ساخته می‌شود. **هیچ پروژه‌ای
        حذف نمی‌شود**، از جمله پروژه‌هایی که در بدنه نیامده‌اند.

        نتیجه‌اش را صریح می‌گوییم: پروژه‌ای که سمت کلاینت حذف شده باشد، در
        همگام‌سازی بعدی دوباره برمی‌گردد؛ سرور نمی‌تواند «حذف‌شده» را از
        «بارگذاری‌نشده» تشخیص دهد. حذف کار مسیر `DELETE /api/projects/{id}` است.

        چون شناسهٔ کلاینت حفظ می‌شود، ارسال دوبارهٔ همان بدنه نتیجهٔ تازه‌ای
        نمی‌سازد (idempotent). شناسهٔ تکراری در یک بدنه `400` است.
        `createdAt` پذیرفته و نادیده گرفته می‌شود؛ این مقدار را سرور تعیین می‌کند.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projects
              properties:
                projects:
                  type: array
                  items:
                    $ref: '#/components/schemas/Project'
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== TASKS ====================
  /api/tasks:
    get:
      tags:
        - Tasks
      summary: دریافت لیست تسک‌ها
      description: |
        همه تسک‌ها را برمی‌گرداند. تسک‌ها مالک ندارند و لیست به کاربر درخواست‌دهنده
        محدود نمی‌شود.

        دو فیلتر بالا اختیاری و مستقل از هم هستند و در صورت ارسال هر دو، با AND ترکیب
        می‌شوند. نبودن یک فیلتر یعنی «فیلتر نکن»، نه «مقدارِ خالی را پیدا کن»؛ مقدار
        خالی (`?projectId=`) هم دقیقا همین معنی را دارد.

        مقدار نامعتبر برای `status` خطای `400` می‌دهد، اما `projectId` ناشناس خطا نیست
        و فقط لیست خالی برمی‌گرداند — یک فیلتر است، نه جستجوی یک منبع مشخص.

        ترتیب: بر اساس تاریخ سررسید (`dueDate`) و تسک‌های بدون سررسید در انتها.
      security:
        - BearerAuth: []
      parameters:
        - name: projectId
          in: query
          required: false
          schema:
            type: string
          description: فیلتر تسک‌ها بر اساس شناسه پروژه
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [todo, in_progress, review, done]
          description: فیلتر تسک‌ها بر اساس وضعیت
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Tasks
      summary: ایجاد تسک جدید
      description: |
        تسک جدید می‌سازد و شناسه آن را سرور تعیین می‌کند (`task_<n>`).

        `status` اگر ارسال نشود برابر `todo` در نظر گرفته می‌شود.

        `projectId` و هر شناسه در `assignees` باید از قبل وجود داشته باشند؛ در غیر این
        صورت پاسخ `400` است و شناسه نادرست در `errors` نام برده می‌شود.

        `dueDate` فقط به شکل `YYYY-MM-DD` پذیرفته می‌شود. ارسال زمان کامل
        (مثلا `2026-08-15T23:30:00Z`) رد می‌شود و کوتاه نمی‌شود.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              projectId: "proj_1"
              title: "پیاده‌سازی صفحه ورود"
              description: "طراحی فرم و اتصال به API"
              status: "in_progress"
              priority: "high"
              assignees: ["usr_101"]
              dueDate: "2026-08-15"
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/tasks/{id}:
    put:
      tags:
        - Tasks
      summary: ویرایش یا تغییر وضعیت تسک
      description: |
        **جایگزینی کامل است، نه ویرایش جزئی.** بدنه این درخواست همان
        `CreateTaskRequest` است که `POST` می‌گیرد، پس نبودن یک فیلد در هر دو یک معنی
        دارد: `null`.

        یعنی برای تغییر وضعیت یک تسک باید **کل تسک** را دوباره بفرستید. درخواستی که فقط
        `projectId` و `title` و `status` داشته باشد با `200` موفق می‌شود و تسک را بدون
        توضیح، بدون اولویت، بدون تاریخ سررسید و **بدون هیچ مسئولی** باقی می‌گذارد.

        `id` و ترتیب تسک قابل تغییر نیستند. `projectId` قابل تغییر است: می‌توان تسک را
        به پروژه دیگری منتقل کرد و پروژه مقصد مثل هر شناسه دیگری بررسی می‌شود.

        اعتبارسنجی بدنه پیش از یافتن تسک انجام می‌شود، پس بدنه نامعتبر برای تسکی که
        وجود ندارد پاسخ `400` می‌گیرد نه `404`. در هر دو حالت چیزی نوشته نمی‌شود.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '200':
          description: تسک پس از جایگزینی
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Tasks
      summary: حذف تسک
      description: |
        تسک و ردیف‌های مربوط به مسئولان آن را حذف می‌کند. پروژه دست‌نخورده می‌ماند.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================== WEEKLY REPORTS ====================
  /api/reports:
    get:
      tags:
        - Weekly Reports
      summary: دریافت تاریخچه گزارش‌های هفتگی
      description: |
        **پاسخ این مسیر به نقش درخواست‌دهنده بستگی دارد:**

        - نقش `admin` همه گزارش‌ها را می‌بیند.
        - هر نقش دیگری فقط گزارش‌های خودش را می‌بیند.

        دلیلش این است که گزارش هفتگی — برخلاف پروژه و تسک — مالک دارد (`userId`) و
        محتوایش (ساعات کارکرد، چالش‌ها) شخصی است. این تفکیک در متن اصلی مشخصات نیامده
        و یک تصمیم ثبت‌شده است.

        نتیجه عملی: پاسخ این آدرس بین کاربران مختلف یکسان نیست و نباید به صورت مشترک
        کش شود.

        ترتیب: از تازه‌ترین به قدیمی‌ترین (`submittedAt` نزولی).
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeeklyReport'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Weekly Reports
      summary: ثبت گزارش کارکرد هفتگی جدید
      description: |
        گزارش را به نام دارنده توکن ثبت می‌کند. `userId` و `userName` و `submittedAt`
        را سرور می‌گذارد و در بدنه درخواست پذیرفته نمی‌شوند — یعنی نمی‌توان گزارشی به
        نام شخص دیگری یا با تاریخ گذشته ثبت کرد.

        `userName` در همان لحظه از روی حساب کاربری کپی می‌شود و بعدا تغییر نمی‌کند؛
        گزارش ثبت‌شده یک سند تاریخی است و نامی را نگه می‌دارد که با آن ثبت شده.

        `hoursWorked` و `tasksCompleted` نمی‌توانند منفی باشند. محدودیت بالا ندارند.

        ثبت چند گزارش برای یک هفته ممنوع نیست: `weekTitle` متن آزاد است و مشخصات هیچ
        یکتایی‌ای برای آن تعریف نکرده.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
            example:
              weekTitle: "هفته دوم مرداد ۱۴۰۵"
              hoursWorked: 42
              tasksCompleted: 8
              achievements: "تکمیل بخش ورود کاربران و تست‌های اتوماسیون E2E"
              challenges: "پیچیدگی هماهنگی SSE روی سرور ابری"
              nextWeekPlan: "طراحی داشبورد آنالیتیکس مدیریت"
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeeklyReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== LIVE CHAT ====================
  /api/chat/messages:
    get:
      tags:
        - Live Chat
      summary: دریافت سابقه پیام‌های چت تیمی
      description: |
        چت یک اتاق مشترک است: در مدل `ChatMessage` نه کانال تعریف شده و نه گیرنده،
        پس همه کاربران یک گفتگو را می‌خوانند و در همان می‌نویسند.

        ترتیب: از قدیمی‌ترین به تازه‌ترین — یک رونوشت گفتگو از بالا به پایین خوانده می‌شود.

        کلاینتی که به `/api/chat/stream` وصل می‌شود فقط پیام‌های پس از اتصال را دریافت
        می‌کند؛ آنچه از دست داده را از همین مسیر می‌گیرد.
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Live Chat
      summary: ارسال پیام جدید در چت
      description: |
        فرستنده از توکن برداشته می‌شود، نه از بدنه‌ی درخواست؛ همچنین `id`، نام و آواتار
        فرستنده و زمان ارسال را سرور مهر می‌زند. بنابراین ارسال پیام به نام شخص دیگر یا
        با تاریخ گذشته ممکن نیست.

        پیام پس از ثبت شدن در پایگاه داده — و نه پیش از آن — برای همه‌ی اتصال‌های باز
        `/api/chat/stream` منتشر می‌شود.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
            example:
              content: "سلام همکاران گرامی، گزارش این هفته ثبت شد."
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/chat/stream:
    get:
      tags:
        - Live Chat
      summary: استریم زنده پیام‌های چت (SSE - Server-Sent Events)
      description: |
        اتصال بلندمدت (HTTP Connection) جهت دریافت لحظه‌ای پیام‌های جدید بدون رفرش مرورگر.
        بدنه‌ی هر رویداد دقیقاً همان `ChatMessage` مسیرهای دیگر است، تا کلاینت برای
        پیام زنده و پیام بایگانی‌شده به دو تحلیل‌گر جداگانه نیاز نداشته باشد.

        **این مسیر هم مانند بقیه توکن می‌خواهد.** در متن اولیه‌ی مشخصات بلوک `security`
        برای این مسیر نیامده بود، ولی همان پیام‌هایی را می‌فرستد که
        `/api/chat/messages` بدون توکن نمی‌دهد؛ باز گذاشتنش پاسخ ۴۰۱ آن مسیر را
        بی‌اثر می‌کرد. این یک تصمیم ثبت‌شده است.

        هزینه‌اش سمت کلاینت است: `EventSource` مرورگر نمی‌تواند هدر `Authorization`
        بفرستد، پس فرانت‌اند باید از یک خواننده‌ی SSE مبتنی بر `fetch` استفاده کند.

        فقط پیام‌های پس از برقراری اتصال ارسال می‌شوند؛ چیزی بازپخش نمی‌شود.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: جریان زنده رویدادها (text/event-stream)
          content:
            text/event-stream:
              schema:
                type: string
                example: "data: {\"id\":\"msg_201\",\"senderName\":\"علی\",\"content\":\"سلام!\",\"timestamp\":\"2026-07-28T10:00:00Z\"}\n\n"
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== FILE UPLOAD ====================
  /api/upload:
    post:
      tags:
        - File Upload
      summary: آپلود فایل تا سقف ۵۰ مگابایت
      description: |
        یک بخش `multipart/form-data` با نام `file`. سقف ۵۰ مگابایت (۵۲۴۲۸۸۰۰ بایت) است و
        همین‌جا بررسی می‌شود؛ فایل بزرگ‌تر با ۴۱۳ و بدنه خطای استاندارد رد می‌شود.

        نام ذخیره‌شده `<epoch>_<نام اصلی>` است. نام اصلی پاک‌سازی می‌شود — مسیر از آن حذف
        و هر نویسه‌ای بیرون از حرف، رقم، نقطه، خط تیره و زیرخط به زیرخط تبدیل می‌شود.
        حروف فارسی حفظ می‌شوند. اگر دو فایل هم‌نام در یک ثانیه آپلود شوند، نام دوم چهار
        نویسه تصادفی می‌گیرد؛ هیچ فایلی بازنویسی نمی‌شود.

        **`cloudMetadata` ساختگی است.** فایل روی دیسک همین سرور ذخیره می‌شود و هیچ
        ارتباطی با فضای ابری برقرار نیست. این بخش از پیکربندی پر می‌شود تا شکل پاسخ همانی
        بماند که مستند شده، اما `cdnUrl` به میزبانی اشاره می‌کند که چیزی سرو نمی‌کند و
        `provider` فقط یک رشته در فایل تنظیمات است. این تصمیم D4 است.

        `url` نسبی و روی همین API است: `GET /uploads/{filename}` بایت‌ها را برمی‌گرداند.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: فایل مورد نظر جهت آپلود (حداکثر ۵۰ مگابایت)
      responses:
        '200':
          description: فایل با موفقیت آپلود شد و متادیتای ذخیره‌سازی ابری بازگردانده شد
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
              example:
                success: true
                url: "/uploads/1722150000_report.pdf"
                filename: "1722150000_report.pdf"
                size: 10485760
                cloudMetadata:
                  cdnUrl: "https://cdn.example.com/uploads/1722150000_report.pdf"
                  provider: "Google Cloud Object Storage"
                  objectKey: "uploads/1722150000_report.pdf"
        '400':
          description: بخش `file` ارسال نشده یا فایل خالی است
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "فایلی ارسال نشده است."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: |
            فایل بزرگ‌تر از ۵۰ مگابایت است.

            یک سقف دوم هم در سطح سرور وجود دارد که کمی بالاتر تنظیم شده (چون پوشش
            multipart خودش چند کیلوبایت به درخواست اضافه می‌کند). درخواستی که از آن سقف
            هم بگذرد، پیش از رسیدن به کد برنامه قطع می‌شود و ۴۱۳ بدون بدنه برمی‌گرداند.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "حجم فایل بیشتر از حد مجاز است. حداکثر ۵۰ مگابایت."

  /uploads/{filename}:
    get:
      tags:
        - File Upload
      summary: دریافت فایل آپلودشده
      description: |
        **این مسیر در نسخه اولیه مشخصات نبود و اضافه شده است.** بدون آن، `url` که
        `POST /api/upload` برمی‌گرداند به هیچ‌جا نمی‌رسد و همیشه ۴۰۴ می‌شود.

        نیازمند توکن است، مثل هر مسیر دیگری بیرون از `/api/auth` و `/api/health`. هزینه‌اش
        روی فرانت‌اند است: مرورگر هدر Authorization را روی `<img src>` نمی‌فرستد، پس
        نمایش تصویر آپلودشده نیاز به `fetch` و ساختن blob URL دارد. جایگزینش این بود که
        هر فایل آپلودشده برای هر کسی که نامش را بداند قابل خواندن باشد و نام‌ها راز نیستند.

        نوع محتوا در خروجی محدود می‌شود: فقط تصویرهای بی‌خطر (`png`، `jpg`، `jpeg`،
        `gif`، `webp`، `avif`، `bmp`) با نوع واقعی خود و به‌صورت inline سرو می‌شوند. هر
        چیز دیگر — از جمله PDF و به‌ویژه `svg` و `html` که می‌توانند اسکریپت اجرا کنند —
        با `application/octet-stream` و `Content-Disposition: attachment` برمی‌گردد. همه
        پاسخ‌ها هدر `X-Content-Type-Options: nosniff` دارند.
      security:
        - BearerAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          description: همان `filename` که پاسخ آپلود برگردانده است
          example: "1722150000_report.pdf"
      responses:
        '200':
          description: محتوای فایل
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            فایلی با این نام وجود ندارد — یا نامی که فرستاده شده اصلاً مجاز نیست
            (مثلاً تلاش برای بیرون رفتن از پوشه آپلود). هر دو حالت یک پاسخ می‌گیرند تا
            حدس‌زدن مسیرها چیزی درباره دیسک سرور لو ندهد.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                message: "منبع مورد نظر پیدا نشد."

  # ==================== TEAM MEMBERS ====================
  /api/members:
    get:
      tags:
        - Team Members
      summary: دریافت لیست اعضای تیم
      description: |
        فهرست همه حساب‌های ثبت‌شده، مرتب‌شده بر اساس نام با ترتیب الفبای فارسی.

        این مسیر فقط خواندنی است و این عمدی است: عضو جدید از راه
        `POST /api/auth/register` اضافه می‌شود، نه از اینجا.

        کاربران غیرفعال هم در فهرست هستند و با `status` مشخص می‌شوند — حذف آن‌ها از
        فهرست، این فیلد را بی‌معنی می‌کرد و کسانی را پنهان می‌کرد که هنوز روی تسک‌ها
        مسئول‌اند.
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamMember'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================== CENTRAL LOGGING ====================
  /api/logs:
    post:
      tags:
        - Central Logging
      summary: ارسال و ثبت لاگ از فرانت‌اند
      description: ذخیره لاگ‌ها و خطاهای کلاینت در فایل‌های متمرکز server `/logs/app.log` و `/logs/error.log`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - level
                - message
              properties:
                level:
                  type: string
                  enum: [info, warn, error]
                message:
                  type: string
                context:
                  type: object
                  additionalProperties: true
            example:
              level: "error"
              message: "Failed to render chart component"
              context:
                component: "DashboardChart"
                userId: "usr_101"
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'

  # ==================== HEALTH ====================
  /api/health:
    get:
      tags:
        - System
      summary: بررسی وضعیت سلامت سرور و دیتابیس
      responses:
        '200':
          description: وضعیت سرور نرمال است
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"
                  timestamp:
                    type: string
                    example: "2026-07-28T08:12:00.000Z"
                  database:
                    type: string
                    example: "connected"

# ==================== COMPONENTS & SCHEMAS ====================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: توکن دسترسی JWT صادر شده در پاسخ ورود

  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - studentId
        - password
      properties:
        name:
          type: string
          maxLength: 255
          description: نام و نام خانوادگی کاربر
        studentId:
          type: string
          maxLength: 64
          description: شماره دانشجویی یا نام کاربری، باید یکتا باشد
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: >-
            حداقل هشت نویسه. سقف ۷۲ نویسه محدودیت الگوریتم bcrypt است، نه سیاست امنیتی.

    LoginRequest:
      type: object
      required:
        - studentId
        - password
      properties:
        studentId:
          type: string
          description: شماره دانشجویی یا نام کاربری ورود
        password:
          type: string
          description: رمز عبور کاربر

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/UserProfile'

    UserProfile:
      type: object
      properties:
        id:
          type: string
        studentId:
          type: string
        name:
          type: string
        email:
          # null until the user supplies one: ثبت‌نام فقط نام، شماره دانشجویی و رمز
          # عبور می‌گیرد، و ایمیل بعدا از طریق PUT /api/users/me تکمیل می‌شود.
          type: [string, "null"]
          format: email
        role:
          type: string
          enum: [admin, student]
        avatar:
          type: string
        theme:
          type: string
          enum: [light, dark]
        language:
          type: string
          enum: [fa, en]
        notificationsEnabled:
          type: boolean

    UpdateUserProfileRequest:
      type: object
      # هیچ فیلدی الزامی نیست و فیلد ارسال‌نشده تغییری نمی‌کند.
      # حداکثر طول‌ها همان محدودیت ستون‌های جدول users هستند.
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
        email:
          type: string
          format: email
          maxLength: 320
        avatar:
          type: string
          maxLength: 1024
        theme:
          type: string
          enum: [light, dark]
        language:
          type: string
          enum: [fa, en]
        notificationsEnabled:
          type: boolean

    Project:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        color:
          type: string
        icon:
          type: string
        createdAt:
          type: string

    CreateProjectRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, "null"]
        color:
          type: [string, "null"]
          maxLength: 32
        icon:
          type: [string, "null"]
          maxLength: 64

    Task:
      type: object
      required:
        - id
        - projectId
        - title
        - status
        - assignees
      properties:
        id:
          type: string
        projectId:
          type: string
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
          enum: [todo, in_progress, review, done]
        priority:
          type: [string, "null"]
          enum: [low, medium, high, null]
        assignees:
          type: array
          description: |
            شناسه کاربران مسئول. همیشه آرایه است و وقتی کسی مسئول نیست `[]` برمی‌گردد،
            نه `null`. ترتیب آن بخشی از قرارداد نیست.
          items:
            type: string
        dueDate:
          type: [string, "null"]
          format: date
          description: تاریخ سررسید به شکل `YYYY-MM-DD` — تاریخ است، نه زمان.
          example: "2026-08-15"

    CreateTaskRequest:
      type: object
      required:
        - title
        - projectId
      properties:
        projectId:
          type: string
          maxLength: 64
          description: باید به پروژه‌ای موجود اشاره کند، وگرنه `400`.
        title:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: [string, "null"]
        status:
          type: string
          enum: [todo, in_progress, review, done]
          default: todo
        priority:
          type: [string, "null"]
          enum: [low, medium, high, null]
        assignees:
          type: array
          description: |
            شناسه کاربران مسئول. هر شناسه باید کاربری موجود باشد، وگرنه `400`.
            تکراری‌ها یک بار در نظر گرفته می‌شوند.
          items:
            type: string
        dueDate:
          type: [string, "null"]
          format: date
          description: |
            فقط به شکل `YYYY-MM-DD`. زمان کامل پذیرفته نمی‌شود و کوتاه هم نمی‌شود،
            چون حذف بی‌صدای بخش زمان می‌تواند سررسید را تا یک روز جابه‌جا کند.
          example: "2026-08-15"

    WeeklyReport:
      type: object
      required:
        - id
        - userId
        - userName
        - weekTitle
        - hoursWorked
        - tasksCompleted
        - submittedAt
      properties:
        id:
          type: string
        userId:
          type: string
          description: شناسه ثبت‌کننده گزارش. سرور آن را از توکن می‌گذارد.
        userName:
          type: string
          description: |
            نام ثبت‌کننده در لحظه ثبت. کپی است، نه ارجاع — تغییر نام حساب کاربری
            گزارش‌های قبلی را بازنویسی نمی‌کند.
        weekTitle:
          type: string
        hoursWorked:
          type: number
        tasksCompleted:
          type: integer
        achievements:
          type: [string, "null"]
        challenges:
          type: [string, "null"]
        nextWeekPlan:
          type: [string, "null"]
        submittedAt:
          type: string
          format: date-time
          description: زمان ثبت به شکل ISO-8601 و در منطقه زمانی UTC.
          example: "2026-08-08T14:00:00Z"

    CreateReportRequest:
      type: object
      required:
        - weekTitle
        - hoursWorked
        - tasksCompleted
      properties:
        weekTitle:
          type: string
          minLength: 1
          maxLength: 255
        hoursWorked:
          type: number
          minimum: 0
          maximum: 9999.99
          multipleOf: 0.01
          description: ساعات کارکرد. اعشار تا دو رقم پذیرفته می‌شود.
        tasksCompleted:
          type: integer
          minimum: 0
        achievements:
          type: [string, "null"]
        challenges:
          type: [string, "null"]
        nextWeekPlan:
          type: [string, "null"]

    ChatMessage:
      type: object
      required:
        - id
        - senderId
        - senderName
        - content
        - timestamp
      properties:
        id:
          type: string
          maxLength: 64
        senderId:
          type: string
          maxLength: 64
        senderName:
          type: string
          maxLength: 255
          description: |
            نام فرستنده در لحظه‌ی ارسال، روی خود پیام نگهداری می‌شود. اگر بعداً نامش را
            عوض کند، آنچه در تاریخچه نوشته شده تغییر نمی‌کند.
        senderAvatar:
          type: [string, "null"]
          maxLength: 1024
        content:
          type: string
          minLength: 1
        fileUrl:
          type: [string, "null"]
          maxLength: 1024
        timestamp:
          type: string
          format: date-time
          description: زمان ارسال، به شکل ISO-8601 (ستون `sent_at`).

    SendMessageRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
          minLength: 1
          description: نمی‌تواند خالی یا فقط فاصله باشد.
        fileUrl:
          type: [string, "null"]
          maxLength: 1024
          description: |
            نشانی فایلی که `POST /api/upload` برمی‌گرداند. اینجا چیزی دریافت یا بررسی
            نمی‌شود.

    TeamMember:
      type: object
      required:
        - id
        - name
        - role
        - status
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: [string, "null"]
          format: email
          description: |
            می‌تواند `null` باشد: ثبت‌نام فقط نام و شماره دانشجویی و رمز عبور می‌گیرد،
            پس حساب کاربری پیش از داشتن ایمیل وجود دارد.
        role:
          type: string
          enum: [admin, student]
        status:
          type: string
          description: |
            مشخصات مقدارهای مجاز را تعیین نکرده، پس متن آزاد است. داده اولیه از
            `active` و `inactive` استفاده می‌کند.

    FileUploadResponse:
      type: object
      required:
        - success
        - url
        - filename
        - size
        - cloudMetadata
      properties:
        success:
          type: boolean
        url:
          type: string
          description: |
            نشانی نسبی روی همین API. `GET /uploads/{filename}` آن را سرو می‌کند و نیازمند
            توکن است. همین مقدار است که در `ChatMessage.fileUrl` ذخیره می‌شود.
        filename:
          type: string
          description: نام ذخیره‌شده روی سرور، نه نامی که کلاینت فرستاده است
        size:
          type: integer
          format: int64
          description: تعداد بایت‌های ذخیره‌شده، اندازه‌گیری‌شده روی سرور
        cloudMetadata:
          type: object
          description: |
            **ساختگی.** هیچ فضای ابری‌ای در کار نیست؛ این سه مقدار از پیکربندی ساخته
            می‌شوند تا شکل پاسخ مستند حفظ شود. تصمیم D4.
          required:
            - cdnUrl
            - provider
            - objectKey
          properties:
            cdnUrl:
              type: string
              description: از `app.upload.cdn-base-url` ساخته می‌شود و فعلاً به جایی نمی‌رسد
            provider:
              type: string
              description: یک رشته ثابت در فایل تنظیمات
            objectKey:
              type: string
              description: «کلید» فرضی، یعنی `uploads/<filename>`

    SuccessMessageResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        errors:
          type: array
          items:
            type: string

  responses:
    SuccessMessage:
      description: عملیات با موفقیت انجام شد
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessMessageResponse'
          example:
            success: true
            message: "عملیات با موفقیت انجام شد."

    BadRequest:
      description: درخواست نامعتبر است (خطای اعتبارسنجی ورودی‌ها)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "اطلاعات ورودی نامعتبر است."

    Unauthorized:
      description: عدم احراز هویت یا توکن نامعتبر/منقضی شده
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "دسترسی غیرمجاز. لطفا دوباره وارد شوید."

    NotFound:
      description: منبع مورد نظر یافت نشد
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            message: "منبع مورد نظر پیدا نشد."
